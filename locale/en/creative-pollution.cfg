[mod-name]
creative-pollution=Creative Pollution

[mod-description]
creative-pollution=Dump oil, lubricant and acid straight into the water through outfall pipes. Tainted water spreads with the volume dumped, yields a different fluid from offshore pumps, and can only be reclaimed by piping in chlorine once the dumping has stopped.

[entity-name]
cp-outfall=Outfall pipe

[entity-description]
cp-outfall=Build it on a shoreline like an offshore pump. Whatever fluid is piped into it is dumped into the water. Pollutants taint the water; chlorine treats it.

[item-name]
cp-sodium=Sodium

[fluid-name]
cp-chlorine=Chlorine
cp-tainted-water=Water tainted with __1__

[fluid-description]
cp-chlorine=Pipe it into an outfall to treat tainted water. It does nothing while the water is still being polluted.
cp-tainted-water=Drawn from tainted water. Boilers and recipes that need clean water will not accept it.

[tile-name]
cp-tainted-water=Water tainted with __1__
cp-tainted-water-blend=Water tainted with __1__ and __2__

[technology-name]
cp-effluent-dumping=Effluent dumping
cp-water-treatment=Water treatment

[technology-description]
cp-effluent-dumping=Outfall pipes dump unwanted fluids into the nearest body of water.
cp-water-treatment=Chlorine reclaims tainted water, once the dumping has stopped.

[mod-setting-name]
cp-units-per-tile=Pollutant per tile
cp-chlorine-per-tile=Chlorine per tile
cp-taint-seconds=Seconds water stays "being polluted"
cp-max-slick-radius=Maximum slick radius
cp-air-pollution=Air pollution per 1000 units dumped

[mod-setting-description]
cp-units-per-tile=Units of pollutant it takes to taint one tile of water. Lower values make slicks spread faster.
cp-chlorine-per-tile=Units of chlorine it takes to treat one tainted tile.
cp-taint-seconds=Chlorine has no effect until this long after the last pollutant was dumped into the same water.
cp-max-slick-radius=How far, in tiles, one outfall can spread or treat a slick. Large values cost more performance on big lakes.
cp-air-pollution=Ordinary air pollution released at the outfall for every 1000 units dumped.

[cp-status]
dumping=Dumping into the water
saturated=Nothing left to taint in reach
treating=Treating the water
blocked=The water is still being polluted
nothing-to-treat=No tainted water in reach
no-water=No water in front of the outfall

[cp-command]
status-help=Prints how many outfalls exist, or the state of the outfall under the cursor.
status-count=__1__ outfall(s) registered. Hover over an outfall and run the command again for its details.
